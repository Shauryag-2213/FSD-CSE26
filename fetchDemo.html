<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Demo</title>
    <style>
        table{
            border : 2px solid green;
            border-radius : 10px;
            gap: 10px;
            margin : auto;
        }
        .header{
            gap: 90px;
            background-color: black;
            color: white;
        }
        .row{
            background-color: lightgray;
            padding : 10px;
        }
    </style>
    <script>
        let rate = 0;
       async function getProducts(){
        const URL = "https://dummyjson.com/products?limit=10&skip=5";
        try{
            const res = await fetch(URL);
            console.log("Response:", res);
            const data = await res.json();
            console.log("Data:", data.products);
            let rows = "";
            data.products.map((i,index) => (rows = rows +`
            <tr class = "row">
                    <td>${index+1}</td>
                    <td>${i.title}</td>
                    <td><img src = "${i.images[0]}" width = "50px" height = "50px"></td>
                    <td>${i.category}</td>
                    <td>${i.rating}</td>
                    <td>₹${(i.price * rate).toFixed(2)}</td>
                    <td>${i.stock}</td>
                    <td><button>Add to Cart</button></td>
                </tr>
            `))
            const el = document.getElementById("data");
            el.innerHTML = rows;
        }
        catch(err){
            console.log("Error:", err);
        }
    }
    async function getRate(){
        const URL = "https://open.er-api.com/v6/latest/USD";
        try{
            const res = await fetch(URL);
            const data = await res.json();
            return data.rates.INR;
        }
        catch(err){
            console.log("Error:", err);
        }
    }
    const exchangeRate = async () => {
    rate = await getRate();
    }
    exchangeRate();
    getProducts();
    </script>
</head>
<body>
    <center>
    <h1>List of Content of the Fetch</h1>
    <table>
        <thead>
            <tr class = "header">
                <th>ID</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Rating</th>
                <th>Price(INR)</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="data">
        </tbody>
    </table>
    </center>
</body>
</html>
